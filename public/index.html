<!doctype html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>JAHONORO</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: var(--vh);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) var(--page-x) env(safe-area-inset-bottom);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-text);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
      max-width: 70ch;
      text-align: center;
    }
    .logo {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-logo-lg);
      font-weight: 500;
      line-height: var(--lh-h1);
      letter-spacing: var(--ls-logo);
    }
    .note {
      margin: 0;
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="logo">JAHONORO</h1>
    <p class="note">Toʻylar jadvali tayyorlanmoqda.</p>
  </main>
</body>
</html>
